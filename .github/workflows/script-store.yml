name: Script store checks

on:
  pull_request:
    paths:
      - "src/crates/concat-agent/**"
      - "src/agent-runtime/**"
      - "src/crates/concat/src/embedded/transport.js"
      - ".github/actions/prepare-agent-runtime/**"
      - "src/Cargo.toml"
      - "src/Cargo.lock"
      - "src/rust-toolchain.toml"
      - ".github/workflows/script-store.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: script-store-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  script-store:
    name: Real script storage and strict checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Read the repository toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          components: clippy, rustfmt
      - name: Format the storage crate
        working-directory: src
        run: cargo fmt --check -p concat-agent
      - name: All native agent storage, ownership and configuration tests
        working-directory: src
        run: cargo test --locked -p concat-agent -- --test-threads=2
      - name: Strict checks for every storage target
        working-directory: src
        run: cargo clippy --locked -p concat-agent --all-targets -- -D warnings

  agent-runtime:
    name: Fixed original runtime and native transport checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BK_CAT_PI_REFERENCE: ${{ runner.temp }}/bk-cat-pi-reference
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: ./.github/actions/prepare-agent-runtime
      - name: Strict types against the fixed original source
        working-directory: src/agent-runtime
        run: npm run typecheck
      - name: Ownership, transport and runtime readiness tests
        working-directory: src/agent-runtime
        run: npm test
      - name: Built original components and real conversation persistence
        working-directory: src/agent-runtime
        run: npm run test:original
