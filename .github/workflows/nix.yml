name: Nix

# Proves the flake: `nix build` on Linux whenever the flake, the lock, or
# the workspace's dependencies change, and on demand. The lock is the
# repository's and is refreshed by hand - `nix flake lock`, committed under
# the author's own name - so the job builds exactly what is checked in and
# fails, saying so, when the lock has fallen behind the flake.
on:
  push:
    branches: [main]
    paths:
      - flake.nix
      - flake.lock
      - src/Cargo.lock
      - src/Cargo.toml
      - src/crates/*/Cargo.toml
      - .github/workflows/nix.yml
      - scripts/ci/nix-resources.py
  pull_request:
    paths:
      - flake.nix
      - flake.lock
      - src/Cargo.lock
      - .github/workflows/nix.yml
      - scripts/ci/nix-resources.py
  workflow_dispatch:

# Only a pull request's run is superseded by the next push to it; a run on
# main is the record of whether main builds.
concurrency:
  group: nix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: nix build
    runs-on: ubuntu-24.04
    # A cold build of the whole workspace and its native dependencies.
    timeout-minutes: 120
    # Read only: the job builds what is checked in and writes nothing back
    # (the lock is refreshed by hand; see the top of this file).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23

      # Refreshes nothing: a lock that would change here is a lock the
      # commit should have carried.
      - name: The lock matches the flake
        run: |
          nix flake lock
          if ! git diff --quiet flake.lock; then
            echo "flake.lock is behind flake.nix: run 'nix flake lock' and commit the result" >&2
            git --no-pager diff flake.lock
            exit 1
          fi

      - name: Resources before the build
        run: python3 scripts/ci/nix-resources.py "$RUNNER_TEMP/nix-build-observation/before.json"

      - name: Build
        shell: bash
        run: |
          observation="$RUNNER_TEMP/nix-build-observation"
          mkdir -p "$observation"
          build=(nix build .#concat --print-build-logs --max-jobs 1 --cores 1)
          printf '%q ' "${build[@]}" > "$observation/command.txt"
          printf '\n' >> "$observation/command.txt"
          date -u +%Y-%m-%dT%H:%M:%SZ > "$observation/started-at.txt"
          # Capture both pipeline results immediately. A failed build keeps
          # its own exit code; tee or metadata failures cannot turn it green.
          set +e
          "${build[@]}" 2>&1 | tee "$observation/build.log"
          pipeline_status=("${PIPESTATUS[@]}")
          printf 'nix_exit_code=%s\ntee_exit_code=%s\n' \
            "${pipeline_status[0]}" "${pipeline_status[1]}" > "$observation/exit-status.txt"
          record_status=$?
          if (( pipeline_status[0] != 0 )); then
            exit "${pipeline_status[0]}"
          fi
          if (( pipeline_status[1] != 0 )); then
            exit "${pipeline_status[1]}"
          fi
          exit "$record_status"

      - name: Resources after the build (also on failure)
        if: always()
        run: python3 scripts/ci/nix-resources.py "$RUNNER_TEMP/nix-build-observation/after.json"

      # A window cannot open on the runner, so the check is that the binary
      # is there, links, and resolves every library it needs.
      - name: Check the binary links
        run: |
          file result/bin/.concat-wrapped || file result/bin/concat
          ldd result/bin/.concat-wrapped 2>/dev/null | grep -i 'not found' && exit 1 || true

      - name: Keep the build log and resource observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nix-build-observation-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/nix-build-observation/
          if-no-files-found: error
