[package]
name = "concat-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Native ownership and recovery admission for the embedded agent host"

[dependencies]
rusqlite = { version = "=0.42.0", features = ["bundled", "hooks"] }
fallible-iterator = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sha2 = "0.10"
getrandom = "0.3"
url = "2"
tempfile = "3"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security_Credentials"] }

[target.'cfg(target_os = "android")'.dependencies]
# Reuse the Android app's libc; Rust 1.93.1 has no Android File::lock support.
libc = "0.2"

[lints]
workspace = true
