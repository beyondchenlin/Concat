[package]
name = "jni-runtime-probe"
version = "0.1.0"
edition = "2024"
rust-version = "1.93.1"
publish = false
description = "Isolated real-VM Android JNI scalar-boolean regression probe."

[workspace]
resolver = "2"

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "=0.6.1", features = ["native-activity"] }
jni = "=0.22.4"
jni-sys = "=0.4.1"

[build-dependencies]
android-build = "=0.1.4"

[patch.crates-io]
jni = { path = "../../../src/patches/jni" }
jni-macros = { path = "../../../src/patches/jni-macros" }

[profile.dev]
incremental = false
panic = "unwind"

[profile.dev.package."*"]
opt-level = 2

[package.metadata.android]
package = "app.concat.jniregression"
apk_name = "BKCAT-JniRegression"
build_targets = ["aarch64-linux-android"]

[package.metadata.android.sdk]
min_sdk_version = 26
target_sdk_version = 35

[package.metadata.android.application]
label = "BK CAT 接口回归探针"

[package.metadata.android.application.activity]
launch_mode = "singleTop"

